services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: groundwater
      POSTGRES_USER: gwuser
      POSTGRES_PASSWORD: changeme
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../etl/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gwuser -d groundwater"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://gwuser:changeme@db:5432/groundwater
      MODEL_ARTIFACT_DIR: /app/ml/artifacts
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../ml/artifacts:/app/ml/artifacts
      - ../backend/app:/app/backend/app  # Mount backend code for live reload
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
