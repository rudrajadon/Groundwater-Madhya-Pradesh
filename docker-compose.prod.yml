version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gw-backend-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./groundwater.db}
      - CORS_ORIGINS=https://rudrajadon.in
      - ENVIRONMENT=production
    volumes:
      - ./GW_Data:/app/GW_Data:ro
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: gw-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_BASE=https://rudrajadon.in/api/groundwater
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - gw-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/mpgroundwatermonitor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  gw-network:
    driver: bridge
